<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC555 V/F 測定アプリ</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; }
        .value { font-size: 2.2rem; font-weight: bold; color: #28a745; margin: 15px 0; }
        .sub { font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h1>IC555 V/Fモニター</h1>
        <button id="startBtn">測定開始（マイク許可）</button>
        <div class="value" id="freqVal">0 Hz</div>
        <div class="sub" id="voltVal">推定電圧: 0.000 V</div>
    </div>

    <script>
        let audioCtx, analyser, microphone;
        const startBtn = document.getElementById('startBtn');
        const freqVal = document.getElementById('freqVal');
        const voltVal = document.getElementById('voltVal');

        startBtn.addEventListener('click', async () => {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
                
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                
                microphone.connect(analyser);
                startBtn.style.display = 'none';
                
                detectFrequency();
            } catch (err) {
                alert('マイクエラー: ' + err);
            }
        });

        function detectFrequency() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Float32Array(bufferLength);
            
            function update() {
                requestAnimationFrame(update);
                analyser.getFloatFrequencyData(dataArray);

                let maxIdx = 0;
                let maxVal = -Infinity;
                for (let i = 0; i < bufferLength; i++) {
                    if (dataArray[i] > maxVal) {
                        maxVal = dataArray[i];
                        maxIdx = i;
                    }
                }

                let nyquist = audioCtx.sampleRate / 2;
                let dominantFreq = (maxIdx * nyquist) / bufferLength;

                if (maxVal > -45 && dominantFreq > 10) {
                    freqVal.innerText = dominantFreq.toFixed(1) + " Hz";
                    let estimatedVoltage = dominantFreq * 0.001; // 較正係数
                    voltVal.innerText = "推定電圧: " + estimatedVoltage.toFixed(3) + " V";
                } else {
                    freqVal.innerText = "0 Hz";
                    voltVal.innerText = "推定電圧: 0.000 V";
                }
            }
            update();
        }
    </script>
</body>
</html>
