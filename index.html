<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホ電圧計・光電効果モニター</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f4f4f9; }
        h1 { font-size: 1.5rem; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:active { background: #0056b3; }
        .value { font-size: 2.5rem; font-weight: bold; color: #28a745; margin: 15px 0; }
        canvas { width: 100%; height: 150px; background: #222; border-radius: 4px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>光電効果・電圧モニター</h1>
        <p>マイク入力から起電力を測定します</p>
        <button id="startBtn">測定開始（マイク許可）</button>
        <div class="value" id="voltageVal">0.00 V</div>
        <canvas id="scopeCanvas"></canvas>
    </div>

    <script>
        let audioCtx, analyser, microphone, javascriptNode;
        const startBtn = document.getElementById('startBtn');
        const voltageVal = document.getElementById('voltageVal');
        const canvas = document.getElementById('scopeCanvas');
        const canvasCtx = canvas.getContext('2d');

        startBtn.addEventListener('click', async () => {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
                
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                
                microphone.connect(analyser);
                startBtn.style.display = 'none';
                
                visualize();
            } catch (err) {
                alert('マイクへのアクセスが拒否されたか、エラーが発生しました: ' + err);
            }
        });

        function visualize() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray);

                canvasCtx.fillStyle = '#222';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = '#00ffcc';
                canvasCtx.beginPath();

                const sliceWidth = canvas.width / bufferLength;
                let x = 0;
                let sumSquare = 0;

                for (let i = 0; i < bufferLength; i++) {
                    let v = dataArray[i] / 128.0 - 1.0; // -1 to 1
                    sumSquare += v * v;
                    let y = (v * 0.5 + 0.5) * canvas.height;

                    if (i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                }

                canvasCtx.lineTo(canvas.width, canvas.height / 2);
                canvasCtx.stroke();

                // 簡易的なRMSから電圧換算表示（校正係数はドングル仕様に合わせて調整）
                let rms = Math.sqrt(sumSquare / bufferLength);
                let estimatedVoltage = rms * 3.3; // 係数は実測に合わせて調整用
                voltageVal.innerText = estimatedVoltage.toFixed(3) + " V (Rel)";
            }
            draw();
        }
    </script>
</body>
</html>
