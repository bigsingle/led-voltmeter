<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Voltage Meter</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #v-display { font-size: 4rem; font-weight: bold; margin: 20px 0; color: #0275d8; }
    button { font-size: 1.5rem; padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>LED Voltage Meter</h1>
  <button id="startBtn">測定開始</button>
  <div id="v-display">0.000 V</div>

  <script>
    const CALIBRATION_FACTOR = 1.0;

    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        
        analyser.fftSize = 2048;
        source.connect(analyser);
        
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Float32Array(bufferLength);
        
        function render() {
          analyser.getFloatTimeDomainData(dataArray);
          let peak = 0;
          for (let i = 0; i < bufferLength; i++) {
            if (Math.abs(dataArray[i]) > peak) {
              peak = Math.abs(dataArray[i]);
            }
          }
          const voltage = peak * CALIBRATION_FACTOR;
          document.getElementById('v-display').innerText = `${voltage.toFixed(3)} V`;
          requestAnimationFrame(render);
        }
        render();
        document.getElementById('startBtn').style.display = 'none'; // 測定開始後はボタンを隠す
      } catch (err) {
        alert('マイクのアクセス許可が必要です: ' + err);
      }
    });
  </script>

</body>
</html>
